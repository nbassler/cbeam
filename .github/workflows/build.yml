name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # Style is stock LLVM, so there is nothing to argue about and nothing to
  # learn -- but it only stays that way if something checks. The previous
  # uncrustify config in this repo drifted 14% out of true precisely because
  # nothing did.
  #
  # Pinned to a container rather than the runner image on purpose: clang-format
  # output shifts slightly between major versions, and an unpinned check fails
  # on its own schedule when the runner updates.
  format:
    name: format
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install clang-format
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git clang-format

      - uses: actions/checkout@v7

      - name: Check formatting
        run: |
          clang-format --version
          clang-format --dry-run --Werror src/*.cpp src/*.h tests/*.cpp

  # Fast feedback on every push. This is the job that earns its keep -- the
  # ARM artifacts below are a convenience, this is the one that catches
  # breakage.
  #
  # Both compilers, because they disagree about what deserves a warning and
  # each catches things the other waves through. The Pi builds with gcc; clang
  # is here as a second opinion.
  test:
    name: test (${{ matrix.compiler }}, qt${{ matrix.qtver }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cxx: g++
            package: g++
            qt: qt6-base-dev
            qtver: 6
          - compiler: clang
            cxx: clang++
            package: clang
            qt: qt6-base-dev
            qtver: 6
          # Qt 5 is what Pi OS Bullseye has, and that is where this actually
          # runs today. Without a job here, the Qt 5 path would rot unnoticed.
          - compiler: gcc
            cxx: g++
            package: g++
            qt: qtbase5-dev
            qtver: 5

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags, or git describe cannot name the version

      # make is listed explicitly: Debian has it as a Recommends of cmake, not
      # a Depends, so --no-install-recommends drops it. The runner image
      # happens to ship one, but relying on that is how this breaks later.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake make ${{ matrix.package }} ${{ matrix.qt }}

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCBEAM_QT_VERSION=${{ matrix.qtver }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 4

  # The unit tests again, this time with the address and undefined-behaviour
  # sanitizers watching. Worth its own job: a use-after-free or a signed
  # overflow can leave every assertion passing, so a green test run is not on
  # its own evidence that the code is well behaved.
  #
  # This is not hypothetical here -- the dangling reference that was once in
  # tests/test_model.cpp's own helper is exactly what ASan reports instantly.
  sanitizers:
    name: sanitizers (asan+ubsan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake make clang qt6-base-dev

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure --parallel 4

  # Native ARM64 builds, one per Raspberry Pi OS generation.
  #
  # Not cross-compilation: these run on GitHub's arm64 runners, which are free
  # for public repositories. Cross-compiling Qt6 would mean a matching host Qt
  # for the moc/uic tools plus a sysroot copied off the Pi, and it breaks every
  # time the Pi updates.
  #
  # The container is the important part. A binary linked against the runner's
  # own Ubuntu glibc will not load on Pi OS, which is a Debian release or two
  # behind. Building inside the matching Debian gets the ABI right.
  pi-binary:
    name: pi binary (${{ matrix.debian }})
    runs-on: ubuntu-24.04-arm
    container: debian:${{ matrix.debian }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pi OS 11. No Qt 6 packaged at all, so this one builds against
          # Qt 5 -- and its glibc 2.31 is why the container matters.
          - debian: bullseye
            qt: qtbase5-dev
            qtver: 5
          - debian: bookworm # Pi OS 12
            qt: qt6-base-dev
            qtver: 6
          - debian: trixie # Pi OS 13
            qt: qt6-base-dev
            qtver: 6

    steps:
      # Before checkout, deliberately: without git in the container,
      # actions/checkout falls back to a tarball download, leaving no .git for
      # `git describe` and stamping every binary "unknown".
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git cmake make g++ dpkg-dev \
            ${{ matrix.qt }} file

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Mark the checkout safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCBEAM_QT_VERSION=${{ matrix.qtver }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 4

      - name: Package
        working-directory: build
        run: |
          cpack -G DEB
          # Debian release goes in the filename: the packages are otherwise
          # named identically but are not interchangeable, since each is built
          # against its own glibc and Qt.
          for deb in *.deb; do
            mv "$deb" "${deb%.deb}~${{ matrix.debian }}.deb"
          done

      - name: Report what was built
        run: |
          echo "### cbeam for Pi OS (${{ matrix.debian }}, Qt${{ matrix.qtver }})" \
            >> "$GITHUB_STEP_SUMMARY"
          {
            echo '```'
            grep 'define CB_VERSION ' build/generated/version.h
            file build/cbeam
            dpkg-deb -I build/*.deb | grep -E 'Package|Version|Depends|Architecture'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v7
        with:
          name: cbeam-arm64-${{ matrix.debian }}
          path: build/*.deb
          if-no-files-found: error

  # Tag pushes get their packages attached to the GitHub release. Workflow
  # artifacts are not enough on their own: they expire, and downloading one
  # requires a GitHub login, which a release asset does not.
  release:
    name: attach packages to release
    needs: pi-binary
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          # Create the release if the tag has no release yet, otherwise add to
          # whichever one is already there.
          gh release create "$GITHUB_REF_NAME" dist/*.deb \
              --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
              --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" dist/*.deb \
              --repo "$GITHUB_REPOSITORY" --clobber
